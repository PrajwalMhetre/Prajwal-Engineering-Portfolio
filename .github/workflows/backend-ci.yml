name: Backend CI
on:
  push:
    branches: [main, feature/firebase-backend]
    paths: ["backend/**", "api/**", "tests/**", "admin.*", "public-projects.js", "live-projects.css", "work.html", "requirements.txt", ".env.example", "firestore.*", "storage.rules", "firebase.json", "vercel.json", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "api/**", "tests/**", "admin.*", "public-projects.js", "live-projects.css", "work.html", "requirements.txt", ".env.example", "firestore.*", "storage.rules", "firebase.json", "vercel.json", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend api
      - run: python -m pytest -q
      - run: python -c "from fastapi.testclient import TestClient; from backend.app.main import app; assert '/api/health' in app.openapi()['paths']; assert TestClient(app).get('/api/docs').status_code == 200"
      - run: node --check admin.js && node --check public-projects.js
      - run: python -m json.tool firebase.json >/dev/null && python -m json.tool firestore.indexes.json >/dev/null && python -m json.tool vercel.json >/dev/null
